[build-system]
requires = ["hatchling>=1.5.0", "jupyterlab>=4.0.0,<5", "hatch-nodejs-version>=0.3.2"]
build-backend = "hatchling.build"

[project]
name = "fits_lab_extension"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
classifiers = [
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "jupyter_server>=2.0.0,<3",
]
dynamic = ["version", "description", "authors", "urls", "keywords"]

[tool.hatch.version]
source = "nodejs"

[tool.hatch.metadata.hooks.nodejs]
fields = ["description", "authors", "urls"]

[tool.hatch.build.targets.sdist]
artifacts = ["fits_lab_extension/labextension"]
exclude = [".github", "binder"]

[tool.hatch.build.targets.wheel]
# Force-include the bundled viewer assets so they are always packaged, even if
# a .gitignore pattern would otherwise exclude them (Hatchling honours VCS ignores).
artifacts = ["fits_lab_extension/static/**/*"]

[tool.hatch.build.targets.wheel.shared-data]
"fits_lab_extension/labextension" = "share/jupyter/labextensions/fits-lab-extension"
"install.json" = "share/jupyter/labextensions/fits-lab-extension/install.json"
"jupyter-config/server-config" = "etc/jupyter/jupyter_server_config.d"

[tool.hatch.build.hooks.jupyter-builder]
dependencies = ["hatch-jupyter-builder>=0.5"]
build-function = "hatch_jupyter_builder.npm_builder"
ensured-targets = [
    "fits_lab_extension/labextension/static/style.js",
    "fits_lab_extension/labextension/package.json",
]
skip-if-exists = ["fits_lab_extension/labextension/static/style.js"]

[tool.hatch.build.hooks.jupyter-builder.build-kwargs]
build_cmd = "build:prod"
npm = ["jlpm"]

[tool.hatch.build.hooks.jupyter-builder.editable-build-kwargs]
build_cmd = "install:extension"
npm = ["jlpm"]
source_dir = "src"
build_dir = "fits_lab_extension/labextension"
